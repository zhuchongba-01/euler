name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/euler-${VERSION}-source.tar.gz"

      - name: Build binaries from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/euler-${VERSION}-source.tar.gz" -C "${build_root}"
          "${build_root}/euler-${VERSION}/scripts/build-binaries.sh" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare GitHub release payload
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md
          node scripts/generate-coding-agent-install-lock.mjs --check
          cp packages/coding-agent/install-lock/package.json release-assets/euler-install-package.json
          cp packages/coding-agent/install-lock/package-lock.json release-assets/euler-install-package-lock.json

          cd packages/coding-agent/binaries

          binary_assets=(
            euler-darwin-arm64.tar.gz
            euler-darwin-x64.tar.gz
            euler-linux-x64.tar.gz
            euler-linux-arm64.tar.gz
            euler-windows-x64.zip
            euler-windows-arm64.zip
          )

          for asset in "${binary_assets[@]}"; do
            test -f "${asset}"
          done

          cp "${binary_assets[@]}" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="euler-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            euler-darwin-arm64.tar.gz
            euler-darwin-x64.tar.gz
            euler-linux-x64.tar.gz
            euler-linux-arm64.tar.gz
            euler-windows-x64.zip
            euler-windows-arm64.zip
            euler-install-package.json
            euler-install-package-lock.json
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-binaries:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm
        include:
          - runner: windows-latest
            allow_failure: false
          - runner: ubuntu-latest
            allow_failure: true
          - runner: macos-latest
            allow_failure: true
          - runner: ubuntu-24.04-arm
            allow_failure: true
          - runner: windows-11-arm
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    permissions:
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Extract current-platform binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail

          runtime_platform="$(node -p '`${process.platform}-${process.arch}`')"
          case "${runtime_platform}" in
            darwin-arm64|darwin-x64|linux-arm64|linux-x64)
              platform="${runtime_platform}"
              archive="release-assets/euler-${platform}.tar.gz"
              root="extracted/euler"
              binary="${root}/euler"
              ;;
            win32-arm64)
              platform="windows-arm64"
              archive="release-assets/euler-${platform}.zip"
              root="extracted"
              binary="${root}/euler.exe"
              ;;
            win32-x64)
              platform="windows-x64"
              archive="release-assets/euler-${platform}.zip"
              root="extracted"
              binary="${root}/euler.exe"
              ;;
            *)
              echo "::error::Unsupported runner platform ${runtime_platform}"
              exit 1
              ;;
          esac

          mkdir -p extracted
          if [[ "${archive}" == *.zip ]]; then
            export ARCHIVE_PATH="$(cygpath -w "${archive}")"
            export DESTINATION_PATH="$(cygpath -w extracted)"
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
          else
            tar -xf "${archive}" -C extracted
          fi
          echo "root=${root}" >> "${GITHUB_OUTPUT}"
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
          echo "platform=${platform}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test binary
        shell: bash
        run: |
          "${{ steps.binary.outputs.binary }}" --help
          "${{ steps.binary.outputs.binary }}" --version
          echo "ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "smoke-ok-${{ steps.binary.outputs.platform }}.txt"

      - name: Upload smoke-test marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-ok-${{ matrix.runner }}
          path: smoke-ok-${{ steps.binary.outputs.platform }}.txt
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test-binaries
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download smoke-test markers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: smoke-markers
          pattern: smoke-ok-*
          merge-multiple: true

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          source_asset="euler-${VERSION}-source.tar.gz"
          expected_assets=(
            "${source_asset}"
            euler-darwin-arm64.tar.gz
            euler-darwin-x64.tar.gz
            euler-linux-x64.tar.gz
            euler-linux-arm64.tar.gz
            euler-windows-x64.zip
            euler-windows-arm64.zip
            euler-install-package.json
            euler-install-package-lock.json
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          # Publish only artifacts whose platform passed the smoke test. The
          # Windows x64 smoke result is a hard release gate.
          test -f "../smoke-markers/smoke-ok-windows-x64.txt"

          excluded_assets=()
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-arm64; do
            if [[ ! -f "../smoke-markers/smoke-ok-${platform}.txt" ]]; then
              case "${platform}" in
                windows-*) archive="euler-${platform}.zip" ;;
                *) archive="euler-${platform}.tar.gz" ;;
              esac
              echo "::warning::Dropping ${archive}: no passing smoke test for ${platform}."
              rm -f "${archive}"
              excluded_assets+=("${archive}")
            fi
          done

          if [[ ${#excluded_assets[@]} -gt 0 ]]; then
            # Regenerate checksums over the reduced payload.
            assets=()
            for asset in *; do
              [[ "${asset}" == "SHA256SUMS" || "${asset}" == "RELEASE_NOTES.md" ]] && continue
              assets+=("${asset}")
            done
            sha256sum "${assets[@]}" > SHA256SUMS
          fi

          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          source_asset="euler-${VERSION}-source.tar.gz"
          # Mirror the validated payload: every remaining file except the notes.
          release_assets=()
          for asset in *; do
            [[ "${asset}" == "RELEASE_NOTES.md" ]] && continue
            release_assets+=("${asset}")
          done

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"

          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  publish-npm:
    runs-on: ubuntu-latest
    needs: stage-github-release
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        run: node scripts/publish.mjs

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
      - publish-npm
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-npm
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-npm.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
